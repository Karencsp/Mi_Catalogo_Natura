<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Natura 
    Consultora Karen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>STOCK NATURA Consultora Karen Sanchez Pinto</h2>
    <h2>Descuentos: 1x5%off - 2x10%off - 3 o más x15%off</h3>
    <div class="category-filters">
      <button class="filter-btn" data-category="todos">Todos</button>
      <button class="filter-btn" data-category="promo">Promo</button>
      <button class="filter-btn" data-category="rostro">Rostro</button>
      <button class="filter-btn" data-category="cuidado diario">
    Cuidado Diario
      </button>
      <button class="filter-btn" data-category="cabello">
    Cabello
      </button>
      <button class="filter-btn" data-category="mama&bebe">
    Mamá & Bebé
      </button>
      
      <div class="cart-icon" id="cart-icon">
      🛒
        <span id="cart-count">
        0
        </span>
      </div>

      <div class="whatsapp-btn">
        <a     href="https://wa.me/5491124648528?text=Hola Karen,%20me%20interesa%20saber%20..."
          target="_blank"
        >
          Consultarme
        </a>
      </div>
    </div>

    
    <div id="cart" class="cart-panel hidden">
      <div class="cart-header">
        <h2>🛒 Mi Carrito</h2>
        <button id="close-cart">
          ✕
        </button>
      </div>
      <div id="cart-content">
        No hay productos seleccionados
      </div>
 
    </div>

    <input type="text" id="search" placeholder="Buscar productos...">
  </header>

  <main>
    <section id="product-list" class="grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
